# Copied to compose.override.yml by the deployment bundle when UI secrets exist.
services:
  browser:
    image: caddy:2-alpine@sha256:f6228111e5fafa1a5238258d0858e103f10599b8d1659a146e7726681a002bb9
    restart: unless-stopped
    env_file:
      - path: ./browser.env
        format: raw
    volumes:
      - ./deploy/browser.Caddyfile:/etc/caddy/Caddyfile:ro
    networks:
      default:
      proxy:
        aliases: [logs-on-vps-browser]
    depends_on:
      - victorialogs
    mem_limit: 128m
    cpus: 0.5
    read_only: true
    tmpfs:
      - /config:size=8m
      - /data:size=8m
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  proxy:
    external: true
    name: ${LOGS_PROXY_NETWORK:-databases_default}
