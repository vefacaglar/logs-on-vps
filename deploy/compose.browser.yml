# Copied to compose.override.yml by the deployment bundle when UI secrets exist.
services:
  browser:
    build:
      context: .
      dockerfile: browser/Dockerfile
    image: logs-on-vps-browser:local
    restart: unless-stopped
    env_file:
      - path: ./browser.env
        format: raw
    networks:
      default:
      proxy:
        aliases: [logs-on-vps-browser]
    depends_on:
      - victorialogs
    mem_limit: 128m
    cpus: 0.5
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  proxy:
    external: true
    name: ${LOGS_PROXY_NETWORK:-databases_default}
