<!doctype html>
<html lang="tr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <title>Giriş · Logs · Vefa Çağlar</title>
    <link rel="icon" href="/static/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/static/app.css" />
    <script type="module" src="/static/login.js"></script>
  </head>
  <body class="login-page">
    <header class="masthead">
      <a href="https://vefacaglar.com">Vefa Çağlar</a
      ><span class="separator">/</span><span>Logs</span>
    </header>
    <main class="login-main">
      <div class="eyebrow">Özel erişim</div>
      <h1>Log konsolu<span class="accent">.</span></h1>
      <p class="intro">Devam etmek için giriş yap.</p>
      <form id="login-form">
        <label for="username">Kullanıcı adı</label>
        <input
          id="username"
          name="username"
          autocomplete="username"
          required
          maxlength="64"
          autofocus
          autocapitalize="none"
          spellcheck="false"
        />
        <div class="password-label">
          <label for="password">Şifre</label
          ><button
            id="show-password"
            type="button"
            class="text-button"
            aria-pressed="false"
          >
            Göster
          </button>
        </div>
        <input
          id="password"
          name="password"
          type="password"
          autocomplete="current-password"
          required
          maxlength="72"
        />
        <p id="login-error" class="error-message" role="alert" hidden></p>
        <button class="primary login-submit" type="submit">
          Giriş yap <span aria-hidden="true">↗</span>
        </button>
      </form>
      <p class="login-note">Bu alan yalnız yetkili kullanıma açıktır.</p>
    </main>
    <footer class="login-footer">
      <span>vefacaglar.com</span><span>Log konsolu</span>
    </footer>
  </body>
</html>
